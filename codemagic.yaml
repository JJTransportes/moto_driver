workflows:
  ios_staging:
    name: Moto IOs Staging
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Moto Driver

    triggering:
      events:
      - push
      branch_patterns:
      - pattern: "ios_staging"
      - include: true
      - source: true
      cancel_previous_builds: true

    environment:
      flutter: 3.32.2
      groups:
      - moto_staging
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID

    scripts:
    - name: Set up code signing settings on Xcode project
      script: |
        xcode-project use-profiles

    - name: Get Flutter packages
      script: |
        flutter pub get

    - name: Set application secrets
      script: |
        cat <<EOF > ios/Flutter/Secrets.xcconfig
        IOS_MAPS_API_KEY=$IOS_MAPS_API_KEY
        EOF

    - name: Install pods
      script: |
        find . -name "Podfile" -execdir pod install \;

    - name: Config definitions
      script: |
        cat > .env << EOF
        API_BASE_URL=$API_BASE_URL
        EOF

    - name: Flutter build ipa
      script: |+
        flutter build ipa --release \
          --build-name=1.0.0 \
          --build-number=13 \
          --export-options-plist=/Users/builder/export_options.plist
          
    artifacts:
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - flutter_drive.log

    publishing:
      email:
        recipients:
        - comercialpepiviagens@gmail.com
        notify:
          success: false
          failure: true

      app_store_connect:
        auth: integration
        beta_groups:
        - Moto Driver Staging
        submit_to_testflight: true
        submit_to_app_store: false
        issuer_id: $ISSUER_ID
