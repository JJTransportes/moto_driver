name: moto_driver
description: "Moto Driver app."
publish_to: 'none'

version: 1.0.0+7

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_modular: ^6.3.4
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  dio: ^5.7.0
  signalr_netcore: ^1.3.7
  result_dart: ^2.1.1
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  shared_preferences: ^2.5.0
  path_provider: ^2.1.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path_android: "assets/images/moto_icon.png"
  image_path_ios: "assets/images/moto_icon.png"
  adaptatvie_icon_background: "#ffffff"
  adaptatvie_icon_foreground: "assets/images/moto_icon_adaptative.png"

flutter:
  uses-material-design: true
  assets:
  - assets/images/
  - ".env"
